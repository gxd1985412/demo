server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/my_test_database?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
  freemarker:
    cache: false
    suffix: .ftl
    charset: UTF-8
    template-loader-path: classpath:/templates/

